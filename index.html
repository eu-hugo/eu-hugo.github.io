<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        /* Remove default margin, padding, and set box-sizing to border-box */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Make sure the HTML and body take up the full viewport */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling */
        }
        
        /* Style the video to cover the entire background */
        #background-video {
            position: fixed;
            top: 50%; /* Center the video */
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%; /* Ensure it fills width */
            min-height: 100%; /* Ensure it fills height */
            transform: translate(-50%, -50%); /* Center alignment */
            object-fit: cover; /* Ensure the video covers the entire screen */
        }
    </style>
</head>
<body>
    <!-- Video element for background -->
    <video id="background-video" autoplay loop muted playsinline>
        <source src="https://github.com/ribeiro-santana/ribeiro-santana.github.io/blob/main/bg.mp4" type="video/mp4">
        <!-- Fallback message for browsers that don't support video -->
        Your browser does not support the video tag.
    </video>
</body>
</html>
