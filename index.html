<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #background-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            cursor: pointer;
        }

        /* Overlay (invisible but clickable) */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Hidden by default */
            background: rgba(0, 0, 0, 0.3);
        }

        /* Pop-up styling */
        #popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none; /* Hidden by default */
        }

        #popup button {
            display: block;
            margin: 10px 0;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
            width: 150px;
        }

        #popup button:hover {
            opacity: 0.8;
        }

        .instagram {
            background: #E4405F;
            color: white;
        }

        .youtube {
            background: #FF0000;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Video Background -->
    <video id="background-video" autoplay loop muted playsinline>
        <source src="universe.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Overlay (full-screen, hides pop-up when clicked) -->
    <div id="overlay"></div>

    <!-- Pop-up with Buttons -->
    <div id="popup">
        <button class="instagram" onclick="window.location.href='https://instagram.com/__________hugo'">Instagram</button>
        <button class="youtube" onclick="window.location.href='https://youtube.com/@__________hugo'">YouTube</button>
    </div>

    <script>
        // Get elements
        let video = document.getElementById("background-video");
        let popup = document.getElementById("popup");
        let overlay = document.getElementById("overlay");

        // Show pop-up and overlay when video is clicked
        video.addEventListener("click", function() {
            popup.style.display = "block";
            overlay.style.display = "block"; // Show the overlay
        });

        // Hide pop-up and overlay when clicking on the overlay (not the video)
        overlay.addEventListener("click", function() {
            popup.style.display = "none";
            overlay.style.display = "none";
        });
    </script>
</body>
</html>
