<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Make sure the HTML and body take up the full viewport */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Style the video to cover the entire background */
        #background-video {
            position: fixed;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- Video element for background with onclick event -->
    <video id="background-video" autoplay loop muted playsinline onclick="location.href='pk'">       
        <source src="universe.mp4" type="video/mp4">
        <!-- Fallback message for browsers that don't support video -->
        Your browser does not support the video tag.
    </video>
</body>
</html>
